spring.application.name=la-cesta
spring.config.import=optional:file:./data/tls/local.properties
spring.datasource.url=jdbc:postgresql://${DB_HOST}:5432/postgres?sslmode=verify-full
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.data-source-properties.sslrootcert=${DB_SSL_ROOT_CERT}
spring.flyway.schemas=la_cesta
spring.flyway.locations=classpath:db/migration,classpath:db/postgresql
spring.jpa.properties.hibernate.default_schema=la_cesta
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=7MB
server.servlet.session.timeout=30m
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=true
server.address=127.0.0.1
server.ssl.enabled=${APP_TLS_ENABLED:true}
server.ssl.key-store=${APP_TLS_KEY_STORE:file:./data/tls/localhost.p12}
server.ssl.key-store-password=${APP_TLS_KEY_STORE_PASSWORD:}
server.ssl.key-store-type=PKCS12
server.ssl.enabled-protocols=TLSv1.3,TLSv1.2
server.forward-headers-strategy=${APP_FORWARD_HEADERS_STRATEGY:none}
server.error.include-message=never
