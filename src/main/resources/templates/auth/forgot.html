<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Recuperar contraseña')}"></head>
<body class="auth-page">
  <main class="auth-layout">
    <section class="auth-panel">
      <a th:replace="~{fragments/layout :: brand}"></a>
      <div class="auth-body">
        <h1>Recupera tu contraseña</h1>
        <p class="intro" th:unless="${sent}">Ingresa el correo que usaste para crear tu cuenta.</p>
        <p class="notice notice-success" role="status" th:if="${sent}">
          Si el correo está registrado, recibirás un enlace. Ábrelo en este mismo navegador.
        </p>
        <p class="notice notice-error" role="alert" th:if="${authError}" th:text="${authError}"></p>
        <form class="form-stack" th:unless="${sent}" th:action="@{/recuperar}" method="post" th:object="${form}">
          <div class="field">
            <label for="email">Correo electrónico</label>
            <input id="email" th:field="*{email}" type="email" autocomplete="email" maxlength="254" required
                   aria-describedby="email-error" th:aria-invalid="${#fields.hasErrors('email')}">
            <p id="email-error" class="field-error"><span th:errors="*{email}"></span></p>
          </div>
          <button class="button" type="submit">Solicitar enlace</button>
        </form>
        <p class="auth-switch"><a th:href="@{/ingresar}">Volver a iniciar sesión</a></p>
      </div>
    </section>
    <div th:replace="~{fragments/layout :: photo}"></div>
  </main>
</body>
</html>
