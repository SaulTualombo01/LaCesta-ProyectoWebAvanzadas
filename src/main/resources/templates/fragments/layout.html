<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(titulo)">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="|${titulo} · La Cesta|">La Cesta</title>
  <link rel="icon" type="image/png" th:href="@{/img/cesta-icon.png}">
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <link rel="stylesheet" th:if="${inicio == true}" th:href="@{/css/editorial-store.css}">
</head>
<body>
  <header class="site-header" th:fragment="header(actual)">
    <a class="skip-link" href="#contenido">Saltar al contenido</a>
    <div class="container header-inner">
      <a class="brand" th:href="@{/}">
        <img class="brand-mark" th:src="@{/img/cesta-icon.png}" alt="" width="40" height="40">
        <span>La Cesta</span>
      </a>
      <nav aria-label="Menú principal">
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin}" th:aria-current="${actual == 'admin'} ? 'page' : null">Panel</a>
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/productos}" th:aria-current="${actual == 'productos'} ? 'page' : null">Vista de tienda</a>
        <a sec:authorize="!hasRole('ADMIN')" th:href="@{/}" th:aria-current="${actual == 'inicio'} ? 'page' : null">Inicio</a>
        <a sec:authorize="!hasRole('ADMIN')" th:href="@{/productos}" th:aria-current="${actual == 'productos'} ? 'page' : null">Catálogo</a>
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/ofertas}"
           th:aria-current="${actual == 'admin-ofertas'} ? 'page' : null">Promociones</a>
        <a sec:authorize="!hasRole('ADMIN')" th:href="@{/ofertas}"
           th:aria-current="${actual == 'ofertas'} ? 'page' : null">Ofertas</a>
        <a th:href="@{/chat}" th:aria-current="${actual == 'chat'} ? 'page' : null">Sala general</a>
      </nav>
      <form th:action="@{/salir}" method="post">
        <button type="submit" class="button button-small button-quiet">Cerrar sesión</button>
      </form>
    </div>
  </header>
  <a class="brand" th:fragment="brand" th:href="@{/ingresar}">
    <img class="brand-mark" th:src="@{/img/cesta-icon.png}" alt="" width="40" height="40">
    <span>La Cesta</span>
  </a>
  <div class="auth-photo" th:fragment="photo" aria-hidden="true">
    <img th:src="@{/img/mercado.webp}" alt="">
  </div>
  <div th:fragment="flash" th:if="${exito != null or error != null}">
    <p class="notice notice-success" role="status" th:if="${exito != null}" th:text="${exito}"></p>
    <p class="notice notice-error" role="alert" th:if="${error != null}" th:text="${error}"></p>
  </div>
</body>
</html>
