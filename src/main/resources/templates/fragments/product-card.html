<!doctype html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
  <meta charset="utf-8">
  <title>Tarjeta de producto · La Cesta</title>
</head>

<body>

<!--/*@thymesVar id="producto" type="ec.minimarket.cesta.catalog.Producto"*/-->
<!--/*@thymesVar id="oferta" type="java.lang.Boolean"*/-->

<ul>
  <li class="product-card"
      th:fragment="card(producto, oferta)"
      th:classappend="${oferta ? 'offer-card' : ''}">

    <a class="product-card-link"
       th:href="@{/productos/{id}(id=${producto.id})}"
       th:attr="aria-labelledby=${'producto-' + producto.id}">

      <div class="product-media">

        <img th:if="${producto.imagenRevision != null}"
             th:src="@{/productos/{id}/imagen(id=${producto.id},v=${producto.imagenRevision})}"
             alt=""
             width="450"
             height="400"
             loading="lazy"
             decoding="async">

        <span class="photo-placeholder"
              th:if="${producto.imagenRevision == null}">
                    Sin foto
                </span>

        <span class="product-offer"
              th:if="${producto.precioPromocional != null}"
              th:text="${oferta ? 'Ahorras $' + producto.ahorro : 'En oferta'}">
                    En oferta
                </span>

      </div>

      <div class="product-card-body">

        <p class="product-category"
           th:text="${producto.categoria.nombre}">
          Categoría del producto
        </p>

        <h3 th:id="${'producto-' + producto.id}"
            th:text="${producto.nombre}">
          Nombre del producto
        </h3>

        <div class="price-group">

          <strong class="price"
                  th:text="${'$' + producto.precioFinal}">
          </strong>

          <del th:if="${producto.precioPromocional != null}"
               th:text="${'$' + producto.precio}">
          </del>

        </div>

        <p class="stock"
           th:classappend="${producto.stock == 0 ? 'sold-out' : ''}"
           th:text="${producto.stock == 0 ? 'Agotado' : producto.stock + ' en stock'}">
        </p>

      </div>

    </a>

    <div class="product-card-actions" sec:authorize="!hasRole('ADMIN')">
      <form th:if="${producto.stock > 0}"
            th:action="@{/carrito/agregar}"
            method="post">
        <input type="hidden" name="productoId" th:value="${producto.id}">
        <input type="hidden" name="cantidad" value="1">
        <input type="hidden" name="origen" th:value="${inicio == true ? '/' : (oferta ? '/ofertas' : '/productos')}">
        <button type="submit" class="button button-small product-card-add">
          Agregar al carrito
        </button>
      </form>
      <button th:if="${producto.stock == 0}"
              type="button"
              class="button button-small product-card-add"
              disabled>
        Sin existencias
      </button>
    </div>

  </li>
</ul>

</body>
</html>
